<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Post Screenshot fixture</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f5f7f9;
        color: #0f1419;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      article {
        box-sizing: border-box;
        width: 600px;
        padding: 16px;
        background: #ffffff;
        border: 1px solid #d7dde3;
        border-radius: 12px;
      }
      .tweet-text {
        margin: 8px 0 14px;
        font-size: 20px;
        line-height: 1.35;
      }
      #photo {
        display: block;
        width: 240px;
        height: 120px;
      }
      .media-wrap {
        position: relative;
        width: 240px;
        height: 120px;
        margin-top: 12px;
        overflow: hidden;
        background: #111;
      }
      #video {
        position: absolute;
        inset: 0;
        width: 240px;
        height: 120px;
        object-fit: cover;
      }
      #carousel {
        display: flex;
        width: 200px;
        margin-top: 12px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #carousel::-webkit-scrollbar {
        display: none;
      }
      .slide {
        flex: 0 0 160px;
        height: 80px;
      }
      .slide:nth-child(1) {
        background: #1d9bf0;
      }
      .slide:nth-child(2) {
        background: #00ba7c;
      }
      .slide:nth-child(3) {
        background: #f4212e;
      }
      #menu-host {
        position: fixed;
        top: 80px;
        left: 80px;
        width: 320px;
        background: #ffffff;
        border: 1px solid #d7dde3;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        z-index: 10;
      }
      .menu-item {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        width: 100%;
        padding: 12px 16px;
      }
      .menu-item:hover {
        background-color: rgba(0, 0, 0, 0.03);
      }
      .menu-icon {
        display: flex;
        flex: 0 0 auto;
        justify-content: center;
        padding-right: 12px;
      }
      .menu-icon .x-icon {
        display: flex;
        flex: 0 0 auto;
        width: 18.75px;
        height: 18.75px;
      }
      .menu-text {
        flex: 1;
        min-width: 0;
      }
      #detail-post {
        margin-top: 24px;
      }
      .detail-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
        padding: 8px 0;
        background: #ff00ff;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <article id="post" data-testid="tweet">
      <a href="/tester/status/1234567890" aria-label="status link">time</a>
      <div data-testid="User-Name"><a href="/tester">Tester</a></div>
      <div class="tweet-text">A deterministic test post with an image, a video and a carousel.</div>
      <img id="photo" alt="blue test image" src="http://127.0.0.1:4174/blue.svg" />
      <div class="media-wrap">
        <video
          id="video"
          muted
          playsinline
          crossorigin="anonymous"
          src="http://127.0.0.1:4174/red.webm"
        ></video>
      </div>
      <div id="carousel" aria-label="test carousel">
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
      </div>
      <button id="caret" data-testid="caret" aria-label="更多" aria-haspopup="menu">•••</button>
    </article>
    <article id="detail-post" data-testid="tweet">
      <a href="/tester/status/1234567890" aria-label="detail status link">time</a>
      <div data-testid="User-Name"><a href="/tester">Tester</a></div>
      <div class="tweet-text">A detail post with a reply-sort and quotes row.</div>
      <div data-engagement-action="like">engagement</div>
      <div id="detail-footer-row" class="detail-footer">
        <div><button aria-haspopup="menu" type="button">Relevant</button></div>
        <div>
          <a id="detail-quotes" href="/tester/status/1234567890/quotes">View quotes</a>
        </div>
      </div>
    </article>
    <div id="menu-host"></div>
    <button id="download-test" type="button">download test</button>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
